<style>

*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.75 "IBM Plex Sans Arabic",system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}

svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:grid;grid-template-columns:272px 1fr;height:100%}
.sb{background:var(--sb);border-inline-end:1px solid var(--ln);display:flex;flex-direction:column;padding:14px 12px;gap:3px;min-height:0}
.logo{display:flex;align-items:center;gap:10px;font:500 28px/1 var(--se);padding:6px 8px 14px}.logo i{width:26px;height:26px;border-radius:9px 9px 9px 3px;background:var(--pr)}.logo span{flex:1}
.ni{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;width:100%;text-align:start}
.ni:hover{background:var(--sf2)}.ni[aria-current=true]{background:var(--sf2);font-weight:500}.ni.nw{background:var(--soft);color:var(--pr);font-weight:500;margin-bottom:6px}

.acts{display:flex}.acts button{padding:4px 6px;color:var(--mut);font-size:12px}

.cf{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.cf .sd{margin-inline-start:auto}

.send{width:38px;height:38px;border-radius:12px;background:var(--pr);color:var(--on);display:grid;place-items:center}
.msel{width:auto;max-width:170px;padding:3px 10px;font-size:13px}

.st{display:flex;align-items:center;gap:14px;padding:18px 2px;border-bottom:1px solid var(--ln)}.st>div:first-child{flex:1}
.ov{position:fixed;inset:0;background:rgba(20,12,36,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.md{background:var(--sf);border-radius:20px;padding:22px;width:min(480px,100%);max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:12px}.md h3{margin:0;font:500 22px var(--se)}.md label{display:block;font-size:13px;color:var(--mut);margin-bottom:2px}
.kf{display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;inset-inline:16px;bottom:28px;margin:auto;width:fit-content;max-width:90%;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:30}
.scrim{display:none}
@media(max-width:899px){#app{grid-template-columns:1fr}
.sb{display:none;position:fixed;inset-block:0;inset-inline-start:0;width:min(310px,86%);z-index:15;box-shadow:0 0 50px rgba(15,8,30,.35)}.sb.open{display:flex}
.scrim.open{display:block;position:fixed;inset:0;background:rgba(20,12,36,.4);z-index:14}
.ib.mb{display:grid}.pgtop{display:flex}.pg{padding:16px 16px 40px}.hd h1{font-size:28px}.hero h1{font-size:32px}}
@media(prefers-reduced-motion:no-preference){.md{animation:up .2s ease}@keyframes up{from{transform:translateY(8px);opacity:0}}}
</style>

let S={lang:'ar',theme:'auto',view:'chat',mode:'single',sel:[],cur:null,convs:[],projects:[],files:[],mem:[],keys:[],showArch:false,q:'',mq:'',mcat:'',tab:'live'};
try{Object.assign(S,JSON.parse(localStorage.getItem('lan2')||'{}'))}catch(e){}
S.kp=false;S.ke=null;S.menu=false;S.kmodel=S.kmodel||{};if(!Array.isArray(S.keys))S.keys=[];
const SB_URL='https://xspyqmrkkhlmglswaxgv.supabase.co',SB_KEY='';/* paste the publishable key between the quotes once the app is hosted */
const API=SB_KEY?SB_URL+'/functions/v1':'';
let SES=null,MODELS={};
try{SES=JSON.parse(localStorage.getItem('lan_ses')||'null')}catch(e){}
function q(s){return esc(s).replace(/'/g,'&#39;')}
async function tok(){
 const now=Date.now()/1000;if(SES&&SES.exp>now+60)return SES.at;
 let j;const h={apikey:SB_KEY,'Content-Type':'application/json'};
 if(SES){const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:h,body:JSON.stringify({refresh_token:SES.rt})});if(!r.ok)throw 0;j=await r.json()}
 else{j=await(await fetch(SB_URL+'/auth/v1/signup',{method:'POST',headers:h,body:'{}'})).json()}
 if(!j.access_token)throw 0;SES={at:j.access_token,rt:j.refresh_token,exp:j.expires_at||now+3000};
 try{localStorage.setItem('lan_ses',JSON.stringify(SES))}catch(e){}return SES.at}
async function fx(fn,method,body){
 try{const r=await fetch(API+'/'+fn,{method,headers:{Authorization:'Bearer '+await tok(),apikey:SB_KEY,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
 const j=await r.json().catch(()=>({}));return r.ok?j:{error:j.error||'server_error',message:j.message}}catch(e){return{error:'network'}}}
async function rest(path,opt={}){try{const r=await fetch(SB_URL+'/rest/v1/'+path,{...opt,headers:{Authorization:'Bearer '+await tok(),apikey:SB_KEY,'Content-Type':'application/json',...(opt.headers||{})}});return r.ok?await r.json().catch(()=>({})):null}catch(e){return null}}
async function setApproved(v){const r=await rest('user_settings?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({cost_approved:v})});if(r){S.approved=v;render()}else toast(t('keyFail'))}
async function boot(){
 S.convs.forEach(c=>c.msgs.forEach(m=>(m.cards||[]).forEach(k=>{if(k&&k.s==='load'){k.s='err';k.e=t('e_network')}})));
 if(!API)return;
 const k=await fx('keys','GET');if(k.keys)S.keys=k.keys.map(x=>({id:x.id,name:x.name,provider:x.provider,l4:x.last4}));
 const s=await rest('user_settings?select=cost_approved');S.approved=!!(s&&s[0]&&s[0].cost_approved);render()}
async function loadModels(id){MODELS[id]={loading:1};const j=await fx('chat','POST',{action:'models',key_id:id});
 MODELS[id]=j.models?{list:j.models}:{err:1};if(j.models&&!j.models.includes(S.kmodel[id]))S.kmodel[id]=j.models[0];render()}
function msels(){return S.sel.map(id=>{const m=MODELS[id];
 if(m&&m.list)return `<select class='inp msel' data-a='mdl' data-id='${id}'><optgroup label='${q(kname(id))}'>${m.list.map(x=>`<option${S.kmodel[id]===x?' selected':''}>${esc(x)}</option>`).join('')}</optgroup></select>`;
 return m&&m.err?`<span class='mut'>${esc(kname(id))}: ${t('e_models')}</span>`:m?`<span class='mut'>…</span>`:''}).join('')}
function pickProv(id){const o=document.createElement('div');o.className='ov';
 o.innerHTML=`<div class='md'><h3>${t('provQ')}</h3><div class='chips'>${[['openai','OpenAI'],['gemini','Google'],['anthropic','Anthropic'],['deepseek','DeepSeek']].map(p=>`<button class='chip' data-p='${p[0]}'>${p[1]}</button>`).join('')}</div></div>`;
 o.onclick=async e=>{const p=e.target.dataset.p;if(!p)return;o.remove();const d=await keyReq('PATCH',{id,name:kname(id),provider:p});if(d){S.keys.find(x=>x.id===id).provider=p;render()}};document.body.appendChild(o)}
async function ksave(){
 const n=document.getElementById('kn').value.trim(),k=document.getElementById('kk').value.trim(),e=S.keys.find(x=>x.id===S.ke);
 if(!n)return toast(t('needName'));if(!e&&!k)return toast(t('needKey'));
 if(API){const d=await keyReq(k?'PUT':'PATCH',{id:e&&e.id,name:n,key:k||undefined});if(!d)return;
  upsert({id:d.id,name:n,provider:d.provider,l4:d.last4});S.ke=null;render();if(!d.provider)pickProv(d.id);return}
 upsert({id:e?e.id:uid(),name:n,l4:e&&e.l4});if(k)toast(t('srvOff'));S.ke=null;render()}

async function send(txt){
 const el=document.getElementById('inp')||{value:''},x=txt||el.value.trim();if(!x)return;
 if(S.mode==='auto')return toast(t('autoNote'));
 let c=cc();if(!c){c={id:uid(),title:x.slice(0,40),msgs:[],arch:false};S.convs.unshift(c);S.cur=c.id}
 c.mode=S.mode;c.sel=[...S.sel];
 const tg=S.mode==='single'?S.sel.slice(0,1):S.sel;
 if(!tg.length){c.msgs.push({r:'u',x},{r:'a',cards:[{k:'none',s:'err',e:t('noKeyYet')}]});render();toBottom();return}
 if(!API){c.msgs.push({r:'u',x},{r:'a',cards:tg.map(k=>({k,n:kname(k),s:'err',e:t('noSend')}))});render();toBottom();return}
 if(!S.approved){modal(t('costTitle'),[],()=>setApproved(true).then(()=>S.approved&&send(x)),t('costMsg'),t('agree'));return}
 const turn=crypto.randomUUID(),cards=tg.map(k=>({k,n:kname(k),s:'load'}));
 c.msgs.push({r:'u',x},{r:'a',cards});render();toBottom();
 const run=async(cd,first)=>{const mdl=S.kmodel[cd.k];
  if(!mdl){cd.s='err';cd.e=t('e_nomodel');return}
  const j=await fx('chat','POST',{key_id:cd.k,model:mdl,message:x,conversation_id:c.dbId,mode:S.mode,turn_id:turn,save_user:first});
  if(j.conversation_id)c.dbId=j.conversation_id;
  if(!j.error&&j.text!==undefined){cd.s='ok';cd.t=j.text;cd.m=mdl}
  else{cd.s='err';cd.e=(t('e_'+j.error)!=='e_'+j.error?t('e_'+j.error):t('e_server_error'))+(j.message?': '+j.message:'')}
  render();toBottom()};
 await run(cards[0],true);await Promise.all(cards.slice(1).map(cd=>run(cd,false)))}
const save=()=>{try{localStorage.setItem('lan2',JSON.stringify(S))}catch(e){}};

 ${m.length?m.map(x=>`<div class="li"><div style="flex:1;min-width:0"><div style="white-space:pre-wrap">${esc(x.x)}</div>${x.cat?`<span class="mut">${esc(x.cat)}</span>`:''}</div><button class="btn g" data-a="edm" data-id="${x.id}">${t('edit')}</button><button class="btn d" data-a="delm" data-id="${x.id}">${t('del')}</button></div>`).join(''):`<div class="empty">${t('noMem')}</div>`}`}</div></div>`}

 <div class="st"><div><b>${t('theme')}</b></div><div class="chips">${o('th','auto',t('auto2'),S.theme)}${o('th','light',t('light'),S.theme)}${o('th','dark',t('dark'),S.theme)}</div></div>
 <div class="st"><div><b>${t('keys')}</b><div class="mut">${t('keysDesc')}</div></div><button class="btn" data-a="kpan">${t('keys')} (${S.keys.length})</button></div>
 <div class="st"><div><b>${t('costRow')}</b><div class="mut">${t('costDesc')}</div></div>${API?`<button class="chip" data-a="cost" aria-pressed="${!!S.approved}">${t('agree')}</button>`:''}</div>
 <div class="st"><div><b>${t('install')}</b><div class="mut">${t('installDesc')}</div></div><button class="btn" data-a="inst">${t('install')}</button></div>

function kpanel(){if(!S.kp)return '';const e=S.ke&&S.keys.find(k=>k.id===S.ke);
 return `<div class="ov" data-a="kclose"><div class="md" role="dialog" aria-modal="true"><div class="row"><h3 style="flex:1">${t('keys')}</h3><button class="ib" data-a="kclose" aria-label="${t('cancel')}">✕</button></div><p class="mut" style="margin:0">${t('keyHint')}</p>
 <div class="kf"><input class="inp" id="kn" placeholder="${t('keyName')}" value="${esc(e?e.name:'')}"><input class="inp" id="kk" type="password" autocomplete="off" dir="ltr" placeholder="${e?t('keepKey'):t('keyVal')}"><div class="row"><button class="btn" data-a="ksave">${e?t('save'):t('add')}</button>${e?`<button class="btn g" data-a="kcancel">${t('cancel')}</button>`:''}</div></div>
 ${S.keys.length?S.keys.map(k=>`<div class="li"><div style="flex:1;min-width:0"><b>${esc(k.name)}</b><div class="mut"><bdi>${k.l4?'•••• '+esc(k.l4):t('pending')}</bdi></div></div><button class="btn g" data-a="kedit" data-id="${k.id}">${t('editKey')}</button><button class="btn d" data-a="kdel" data-id="${k.id}">${t('del')}</button></div>`).join(''):`<p class="mut">${t('keyNone')}</p>`}</div></div>`}
function modal(title,fields,ok,msg,lab){
 const o=document.createElement('div');o.className='ov';
 o.innerHTML=`<div class="md" role="dialog" aria-modal="true"><h3>${esc(title)}</h3>${msg?`<p style="margin:0;white-space:pre-line">${esc(msg)}</p>`:''}${fields.map((f,i)=>`<div><label>${esc(f.l)}</label>${f.m?`<textarea class="inp" rows="4" data-i="${i}">${esc(f.v||'')}</textarea>`:`<input class="inp" data-i="${i}" value="${esc(f.v||'')}">`}</div>`).join('')}<div class="row" style="justify-content:flex-end"><button class="btn g" data-x="0">${t('cancel')}</button><button class="btn" data-x="1">${lab||t('save')}</button></div></div>`;
 o.addEventListener('click',e=>{const x=e.target.dataset.x;if(e.target===o||x==='0')o.remove();else if(x==='1'){const v=[...o.querySelectorAll('[data-i]')].map(i=>i.value.trim());o.remove();ok(v)}});
